<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <title>Offline — Royal Image Group</title>
    <style>
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f5f7fa; color: #102a43; font: 16px Arial, sans-serif; text-align: center; }
        main { max-width: 440px; padding: 30px; }
        p { line-height: 1.6; }
        button { padding: 10px 18px; border: 0; border-radius: 6px; background: #102a43; color: #fff; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <main>
        <h1>You’re offline</h1>
        <p>Reconnect to the internet to view the latest organization chart and staff information.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
